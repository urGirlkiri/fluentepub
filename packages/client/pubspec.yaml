name: fluentepub
description: "A WYSIWYG epub reader and editor"

publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.12.0
resolution: workspace

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  lucide_icons_flutter: ^3.1.14+1
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  adaptive_theme: ^3.7.2
  go_router: ^17.2.3
  archive: ^4.0.9
  super_editor: ^0.3.0-dev.51
  drift: ^2.33.0
  flutter_tts: ^4.2.5
  file_picker: ^11.0.2
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5
  logging: ^1.3.0
  sqlite3: ^3.3.1
  path: ^1.9.1
  sqlite3_flutter_libs: ^0.6.0+eol
  provider: ^6.1.5+1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.33.0
  build_runner: ^2.15.0
  
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/images/

flutter_launcher_icons:
  image_path: "assets/branding/1024x1024.png"
  macos:
    generate: true
    image_path: "assets/branding/1024x1024.png"
  windows:
    generate: true
    image_path: "assets/branding/1024x1024.png"
    icon_size: 48
  web:
    generate: true
    image_path: "assets/branding/512x512.png"

